<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簿記3級 合格ナビ</title>
<meta name="description" content="現在地を測って、配点から優先順位を決めて、弱点だけを潰す簿記3級の学習アプリ">
<style>
:root{
  --bg:#fff8f3; --card:#ffffff; --ink:#3a2f2a; --sub:#7a6a62; --line:#f0e0d6;
  --pri:#f0738f; --pri-soft:#fde3e9; --ok:#2f9e6e; --ok-soft:#dff4ea; --ng:#d9534f; --ng-soft:#fbe3e2;
  --acc:#f5a524; --acc-soft:#fff1d6; --blue:#4a7fd4; --blue-soft:#e3ecfb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1f1a18; --card:#2a2321; --ink:#f3e9e4; --sub:#bba9a0; --line:#41352f;
    --pri:#ff8fa8; --pri-soft:#4a2a33; --ok:#5fd19e; --ok-soft:#1f3a2e; --ng:#ff8a85; --ng-soft:#4a2624;
    --acc:#ffc15a; --acc-soft:#43361d; --blue:#86acf0; --blue-soft:#24304a;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1a18; --card:#2a2321; --ink:#f3e9e4; --sub:#bba9a0; --line:#41352f;
  --pri:#ff8fa8; --pri-soft:#4a2a33; --ok:#5fd19e; --ok-soft:#1f3a2e; --ng:#ff8a85; --ng-soft:#4a2624;
  --acc:#ffc15a; --acc-soft:#43361d; --blue:#86acf0; --blue-soft:#24304a;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.02em}
.logo span{color:var(--pri)}
.countdown{font-size:.85rem;color:var(--sub);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
h2{font-size:1.1rem;margin:0 0 8px}
h3{font-size:1rem;margin:16px 0 6px}
p{margin:6px 0}
.muted{color:var(--sub);font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;min-height:44px}
.btn.sub{background:var(--pri-soft);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:150px;background:none;border:0;font:inherit;color:var(--sub);padding:8px 4px 10px;cursor:pointer;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:1.25rem;line-height:1}
nav.tabs button.on{color:var(--pri);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--pri-soft);color:var(--ink)}
.pill.p1{background:var(--pri-soft)} .pill.p2{background:var(--blue-soft)} .pill.p3{background:var(--acc-soft)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--pri);border-radius:999px}
.topic{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.topic:last-child{border-bottom:0}
.topic .nm{flex:1;min-width:0}
.topic .nm b{display:block;font-size:.95rem}
.topic .pct{width:52px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.q{font-weight:700;font-size:1rem;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font:inherit;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt .lbl{font-weight:800;color:var(--pri);margin-right:6px}
table.j{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.j th{font-size:.72rem;color:var(--sub);font-weight:700;text-align:left;padding:0 4px}
table.j td{padding:2px 4px;vertical-align:top}
table.j td.amt{text-align:right;white-space:nowrap}
table.j td.sep{border-left:1px solid var(--line)}
.exp{border-radius:12px;padding:10px 12px;margin:6px 0;font-size:.9rem;background:var(--bg)}
.exp.ok{background:var(--ok-soft)} .exp.ng{background:var(--ng-soft)}
.point{background:var(--acc-soft);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem}
.stat{display:flex;gap:8px}
.stat > div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--sub)}
.advice li{margin:6px 0}
details{border-top:1px dashed var(--line);padding:8px 0}
details summary{cursor:pointer;font-weight:700}
input[type=date],select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
a{color:var(--blue)}
.timer{font-variant-numeric:tabular-nums;color:var(--sub);font-size:.85rem}
.hide{display:none}
textarea{width:100%;min-height:140px;font:inherit;font-size:.8rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">簿記3級 <span>合格ナビ</span></div>
    <div class="countdown" id="countdown"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="home"><span class="ic">🏠</span>ホーム</button>
  <button data-tab="learn"><span class="ic">📺</span>学習</button>
  <button data-tab="drill"><span class="ic">✏️</span>演習</button>
  <button data-tab="feedback"><span class="ic">📊</span>分析</button>
</nav>

<script>
/* ============================================================
   論点マスタ（p = 試験の大問。第1問45点 / 第2問20点 / 第3問35点）
   ============================================================ */
const TOPICS = {
  cash:   {name:"現金・預金", p:1, points:["他人振出の小切手を受け取ったら「現金」","自分で小切手を振り出したら「当座預金」の減少","現金過不足は期中は「現金過不足」、決算で原因不明分を雑損/雑益へ","当座預金の貸方残高は決算で「当座借越」（または借入金）へ振替","小口現金の報告と同時補給なら、貸方はまとめて「当座預金」"]},
  sales:  {name:"商品売買", p:1, points:["三分法：仕入・売上・繰越商品","仕入時の引取運賃（仕入諸掛）は仕入原価に含める","売上時の当社負担の発送費は「発送費」（費用）","内金・手付金は 払ったら前払金／受け取ったら前受金","クレジット販売は「クレジット売掛金」、手数料は支払手数料","消費税（税抜方式）：仕入時 仮払消費税、売上時 仮受消費税"]},

  notes:  {name:"手形・電子記録債権", p:1, points:["受け取った約束手形 → 受取手形（資産）","振り出した約束手形 → 支払手形（負債）","電子記録債権（資産）／電子記録債務（負債）","お金を貸して手形を受け取る → 手形貸付金"]},
  other:  {name:"その他の債権債務", p:1, points:["商品以外の後払い → 未払金／後で受け取る → 未収入金","内容不明の支出 → 仮払金、内容不明の入金 → 仮受金","給料から天引き → 所得税預り金・社会保険料預り金","社会保険料の会社負担分 → 法定福利費","敷金・保証金 → 差入保証金","従業員が立て替えた経費（精算前）→ 未払金"]},
  loan:   {name:"貸付金・借入金", p:1, points:["借入時に利息を差し引かれたら、差額が入金額","返済時の利息は支払利息（費用）","役員への貸付 → 役員貸付金"]},
  fixed:  {name:"有形固定資産", p:1, points:["取得原価 = 購入代価 + 付随費用（仲介手数料・登記料など）","定額法：(取得原価−残存価額)÷耐用年数","期中取得は月割計算","間接法：貸方は「○○減価償却累計額」","売却損益 = 売却価額 − 帳簿価額（取得原価−累計額）","修繕費（現状維持）は費用"]},
  tax:    {name:"税金", p:1, points:["固定資産税・収入印紙 → 租税公課","法人税等の中間納付 → 仮払法人税等","決算：法人税、住民税及び事業税 / 仮払法人税等・未払法人税等","消費税の決算：仮受消費税−仮払消費税 = 未払消費税"]},
  capital:{name:"株式会社の資本", p:1, points:["株式の発行（3級）→ 全額 資本金","当期純利益は 損益 → 繰越利益剰余金","配当決議：繰越利益剰余金 / 未払配当金・利益準備金"]},
  accrual:{name:"経過勘定（前払・未払など）", p:3, points:["前払費用・前受収益は「次期分」を繰り延べる","未払費用・未収収益は「当期分」を見越す","翌期首に再振替仕訳（決算と逆の仕訳）","月数の数え間違いに注意（経過月 vs 残り月）"]},
  closing:{name:"決算整理", p:3, points:["売上原価：仕入/繰越商品（期首）、繰越商品/仕入（期末）＝「しーくりくりしー」","売上原価 = 期首商品 + 当期仕入 − 期末商品","未使用の郵便切手・収入印紙 → 貯蔵品","決算時の現金過不足：借方残→雑損、貸方残→雑益"]},
  books:  {name:"補助簿・伝票", p:2, points:["掛け仕入 → 仕入帳・買掛金元帳・商品有高帳","移動平均法：(残高金額+受入金額)÷(残高数量+受入数量)","先入先出法：古いものから払い出す","3伝票制：入金伝票の相手科目は貸方科目"]},
  voucher:{name:"証ひょう・訂正仕訳", p:2, points:["自社が発行した請求書の控え → 売上側の仕訳","受け取った請求書 → 仕入・経費側の仕訳","訂正仕訳 = 誤った仕訳の逆仕訳 + 正しい仕訳（相殺して最小化）"]},
  fs:     {name:"財務諸表・精算表", p:3, points:["貸倒引当金・減価償却累計額は資産から控除する形で表示","損益計算書：売上高−売上原価＝売上総利益","繰越利益剰余金は貸借対照表の純資産の部"]}
};
const PART_POINTS = {1:45, 2:20, 3:35};

   問題データ
   o[0] が正解。表示時にシャッフル。

const Q = [
/* ---- 現金・預金 ---- */
{id:"cash1",t:"cash",q:"現金の実際有高が帳簿残高より2,000円少ないことが判明した。原因は不明である。",

{id:"cash2",t:"cash",q:"決算日。現金過不足勘定（借方残高）3,000円のうち、2,000円は通信費の記入漏れと判明した。残りは原因不明である。",
 o:[["通信費 2000 / 現金過不足 3000","雑損 1000 / -"],["通信費 2000 / 現金過不足 3000","- / 雑益 1000"],["現金過不足 3000 / 通信費 2000","- / 雑損 1000"],["通信費 3000 / 現金過不足 3000"]],
 e:["正解。借方残高（＝現金が足りなかった）の原因不明分は雑損。","借方残高は不足分なので、原因不明分は損失（雑損）。貸借も合わない。","逆仕訳。借方残高を消すには貸方に現金過不足。","原因不明の1,000円まで通信費にしてはダメ。"],

{id:"cash3",t:"cash",q:"売掛金50,000円の回収として、得意先振出の小切手を受け取った。",
 o:[["現金 50000 / 売掛金 50000"],["当座預金 50000 / 売掛金 50000"],["受取手形 50000 / 売掛金 50000"],["現金 50000 / 売上 50000"]],

 k:"他人振出小切手＝現金。"},
{id:"cash4",t:"cash",q:"買掛金80,000円を、小切手を振り出して支払った。",

 k:"自社振出小切手＝当座預金の減少。"},
{id:"cash5",t:"cash",q:"決算日。当座預金勘定が貸方残高30,000円となっているため、当座借越勘定に振り替える。",
 o:[["当座預金 30000 / 当座借越 30000"],["当座借越 30000 / 当座預金 30000"],["当座預金 30000 / 現金 30000"],["支払利息 30000 / 当座預金 30000"]],

{id:"cash6",t:"cash",q:"小口現金係から、交通費4,000円・消耗品費3,000円の支払報告を受け、ただちに同額を小切手を振り出して補給した。",
 o:[["旅費交通費 4000 / 当座預金 7000","消耗品費 3000 / -"],["旅費交通費 4000 / 小口現金 7000","消耗品費 3000 / -"],["小口現金 7000 / 当座預金 7000"],["旅費交通費 4000 / 現金 7000","消耗品費 3000 / -"]],

{id:"cash7",t:"cash",q:"普通預金口座から定期預金口座へ100,000円を預け替えた。",

/* ---- 商品売買 ---- */
{id:"sales1",t:"sales",q:"商品200,000円を仕入れ、代金は掛けとした。引取運賃5,000円は現金で支払った。",

{id:"sales2",t:"sales",q:"商品300,000円を掛けで売り上げた。当社負担の発送運賃6,000円は現金で支払った。",

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yen = n => Number(n).toLocaleString("ja-JP");
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const partOf = q => TOPICS[q.t].p;

function renderJournal(rows){
  const parse = side => { side = side.trim(); if(side==="-"||side==="") return ["",""]; const m = side.match(/^(.*)\s+(\d+)$/); return m ? [m[1], yen(m[2])] : [side,""]; };
  let h = '<table class="j"><tr><th>借方</th><th></th><th class="sep">貸方</th><th></th></tr>';
  rows.forEach(r => { const [d,c] = r.split("/"); const D = parse(d), C = parse(c||"-");
    h += `<tr><td>${esc(D[0])}</td><td class="amt">${D[1]}</td><td class="sep">${esc(C[0])}</td><td class="amt">${C[1]}</td></tr>`; });
  return h + "</table>";
}
const renderOpt = o => Array.isArray(o) ? renderJournal(o) : esc(o);

/* 論点ごとの成績 */
function stats(){
  const by = {}; Object.keys(TOPICS).forEach(t => by[t] = {n:0, ok:0, time:0, recent:[]});
  S.log.forEach(l => { const b = by[l.t]; if(!b) return; b.n++; if(l.ok) b.ok++; b.time += l.sec; b.recent.push(l.ok); });
  Object.values(by).forEach(b => { b.acc = b.n ? b.ok/b.n : null; b.avg = b.n ? b.time/b.n : 0; b.recentAcc = b.recent.length ? b.recent.slice(-5).filter(x=>x).length / Math.min(5,b.recent.length) : null; });
  return by;
}
/* 問題ごとの最新結果 */
function lastResult(){ const m = {}; S.log.forEach(l => m[l.id] = l.ok); return m; }

/* 優先度 = 弱さ × 大問の配点の重み（未着手は高めに） */
function priorities(){
  const st = stats();
  return Object.keys(TOPICS).map(t => {
    const b = st[t], w = PART_POINTS[TOPICS[t].p] / 45;
    const weak = b.n === 0 ? 0.8 : 1 - (b.recentAcc ?? b.acc);
    return {t, score: weak * (0.5 + w), b};
  }).sort((a,b) => b.score - a.score);
}

function daysLeft(){
  if(!S.exam) return null;
  const d = new Date(S.exam + "T00:00:00"), now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}
function updateCountdown(){
  const d = daysLeft();
  $("#countdown").innerHTML = d === null ? "試験日：未設定" : d >= 0 ? `試験まで <b style="color:var(--pri)">${d}</b> 日` : "試験おつかれさま！";
}

/* ---- 出題セッション ---- */
let session = null;
function startSession(qs, mode, title){
  if(!qs.length){ alert("出題できる問題がないで"); return; }
  session = {qs: qs.map(q => ({q, order: shuffle([0,1,2,3])})), i:0, mode, title, answers:[], t0: Date.now(), qStart: Date.now(), picked:null};
  render(); window.scrollTo(0,0);
}
function startTopic(t){ startSession(shuffle(Q.filter(q=>q.t===t)), "topic", TOPICS[t].name); }
function startDiag(){ const qs = Object.keys(TOPICS).map(t => shuffle(Q.filter(q=>q.t===t))[0]); startSession(shuffle(qs), "diag", "現在地テスト"); }
function startReview(){ const lr = lastResult(); startSession(shuffle(Q.filter(q => lr[q.id]===false)), "review", "間違えた問題"); }
function startMock(){
  // 本番の配点比率に寄せて：第1問系12問、第2問系3問、第3問系5問
  const pick = (p,n) => shuffle(Q.filter(q=>partOf(q)===p)).slice(0,n);
  startSession([...pick(1,12), ...pick(2,3), ...pick(3,5)], "mock", "模試20問");
}
function startSmart(){
  const pr = priorities(), lr = lastResult(), chosen = [];
  // 上位の論点から、未回答 → 間違い → 正解 の順に拾う
  for(const x of pr){
    const qs = shuffle(Q.filter(q=>q.t===x.t)).sort((a,b) => rank(a)-rank(b));
    chosen.push(...qs.slice(0, 3));
    if(chosen.length >= 10) break;
  }
  function rank(q){ return lr[q.id]===undefined ? 0 : lr[q.id]===false ? 1 : 2; }
  startSession(shuffle(chosen.slice(0,10)), "smart", "おまかせ10問");
}

let tick = null;
function renderQuiz(){
  const s = session, cur = s.qs[s.i], q = cur.q, answered = s.picked !== null;
  const labels = ["ア","イ","ウ","エ"];
  let h = `<div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div><b>${esc(s.title)}</b> <span class="muted">${s.i+1} / ${s.qs.length}</span></div>
      <div class="timer" id="timer"></div>
    </div>
    <div class="bar" style="margin:8px 0"><i style="width:${(s.i)/s.qs.length*100}%"></i></div>
    <span class="pill p${partOf(q)}">${esc(TOPICS[q.t].name)}</span>
    <div class="q">${esc(q.q)}</div>`;
  cur.order.forEach((oi, k) => {
    let cls = "opt";
    if(answered){ if(oi===0) cls += " ok"; else if(oi===s.picked) cls += " ng"; }
    h += `<button class="${cls}" ${answered?"disabled":""} onclick="pick(${oi})"><span class="lbl">${labels[k]}</span>${renderOpt(q.o[oi])}</button>`;
  });
  if(answered){
    const ok = s.picked === 0;
    h += `<h3>${ok ? "⭕ 正解！" : "❌ ざんねん…"}</h3>`;
    h += `<p class="muted">選択肢ごとの解説</p>`;
    cur.order.forEach((oi,k) => h += `<div class="exp ${oi===0?"ok":(oi===s.picked?"ng":"")}"><b>${labels[k]}</b>　${esc(q.e[oi])}</div>`);
    h += `<div class="point">💡 ${esc(q.k)}</div>`;
    h += `<div class="row" style="margin-top:12px"><button class="btn block" onclick="nextQ()">${s.i+1<s.qs.length?"次の問題へ":"結果を見る"}</button></div>`;
  }
  h += `</div><button class="btn ghost" onclick="quitSession()">中断してもどる</button>`;
  $("#view").innerHTML = h;
  clearInterval(tick);
  const upd = () => { const el = $("#timer"); if(!el) return; const sec = Math.floor((Date.now()-s.t0)/1000); el.textContent = `⏱ ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`; };
  upd(); tick = setInterval(upd, 1000);
}
function pick(oi){
  const s = session; if(s.picked !== null) return;
  s.picked = oi;
  const q = s.qs[s.i].q, sec = Math.round((Date.now()-s.qStart)/1000), ok = oi===0;
  s.answers.push({id:q.id, t:q.t, ok, sec});
  S.log.push({id:q.id, t:q.t, ok, sec, at: Date.now(), mode: s.mode});
  save(); renderQuiz();
}
function nextQ(){
  const s = session;
  if(s.i+1 < s.qs.length){ s.i++; s.picked = null; s.qStart = Date.now(); renderQuiz(); window.scrollTo(0,0); }
  else finishSession();
}
function quitSession(){ clearInterval(tick); session = null; render(); }
function finishSession(){
  clearInterval(tick);
  const s = session; session = null;
  const n = s.answers.length, ok = s.answers.filter(a=>a.ok).length, sec = Math.round((Date.now()-s.t0)/1000);
  if(s.mode === "diag"){ S.diag = {at: Date.now(), n, ok}; save(); }
  // 大問ごとの得点換算（模試・現在地テスト用の目安）
  const byPart = {1:{n:0,ok:0},2:{n:0,ok:0},3:{n:0,ok:0}};
  s.answers.forEach(a => { const p = TOPICS[a.t].p; byPart[p].n++; if(a.ok) byPart[p].ok++; });
  let est = 0; [1,2,3].forEach(p => { if(byPart[p].n) est += PART_POINTS[p] * byPart[p].ok / byPart[p].n; });
  const showEst = s.mode==="mock" || s.mode==="diag";
  const wrong = s.answers.filter(a=>!a.ok).map(a => TOPICS[a.t].name);
  let h = `<div class="card"><h2>${esc(s.title)}　おつかれさま！</h2>
    <div class="stat"><div><b>${ok}/${n}</b><span>正解</span></div><div><b>${Math.round(ok/n*100)}%</b><span>正答率</span></div><div><b>${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}</b><span>かかった時間</span></div></div>`;
  if(showEst){
    h += `<h3>本番換算の目安：<span style="color:${est>=70?"var(--ok)":"var(--ng)"}">${Math.round(est)}点</span> / 100（合格70点）</h3>
      <p class="muted">大問ごとの正答率に配点（45/20/35）を掛けた目安やで。本番は仕訳の記入・精算表の作成形式やから、実際より高めに出やすいことは覚えといてな。</p>`;
    [1,2,3].forEach(p => { if(byPart[p].n) h += `<div class="topic"><div class="nm"><b>第${p}問系</b><span class="muted">${byPart[p].ok}/${byPart[p].n}問</span></div><div class="pct">${Math.round(PART_POINTS[p]*byPart[p].ok/byPart[p].n)}/${PART_POINTS[p]}</div></div>`; });
  }
  if(wrong.length) h += `<h3>間違えた論点</h3><p>${[...new Set(wrong)].map(esc).join("、")}</p>`;
  h += `<div class="row" style="margin-top:12px"><button class="btn" onclick="go('feedback')">分析を見る</button><button class="btn sub" onclick="go('home')">ホームへ</button></div></div>`;
  $("#view").innerHTML = h; window.scrollTo(0,0);
}

/* ---- 分析・アドバイス ---- */
function buildAdvice(){
  const st = stats(), pr = priorities(), d = daysLeft(), adv = [];
  const total = S.log.length;
  if(!S.diag) adv.push("まずは<b>現在地テスト</b>から。勉強前に解いて、ゴールまでの距離を測るのが先やで。");
  if(total === 0) return adv;
  const partAcc = p => { let n=0, ok=0; Object.keys(TOPICS).filter(t=>TOPICS[t].p===p).forEach(t=>{ n+=st[t].n; ok+=st[t].ok; }); return n ? ok/n : null; };
  const p1 = partAcc(1), p3 = partAcc(3), p2 = partAcc(2);
  if(p1 !== null && p1 < 0.8) adv.push(`第1問（仕訳・45点）の正答率が<b>${Math.round(p1*100)}%</b>。ここは配点が一番大きくて、第3問の土台にもなるから最優先で固めよ。`);
  if(p3 !== null && p3 < 0.7) adv.push(`第3問系（決算整理）の正答率が<b>${Math.round(p3*100)}%</b>。決算整理仕訳ができれば精算表も財務諸表も取れるから、経過勘定と売上原価を重点的にな。`);
  if(p2 !== null && p2 < 0.6) adv.push(`第2問系は${Math.round(p2*100)}%。20点しかないから深追いはせんでええけど、商品有高帳と伝票は計算パターンを覚えたら取りやすいで。`);
  const weak = pr.filter(x => x.b.n >= 2 && x.b.acc < 0.6).slice(0,3);
  if(weak.length) adv.push(`苦手な論点：<b>${weak.map(x=>esc(TOPICS[x.t].name)).join("、")}</b>。「学習」タブの要点を読んでから、間違えた問題だけ解き直そ。`);
  const untouched = Object.keys(TOPICS).filter(t => st[t].n===0);
  if(untouched.length && (d===null || d > 3)) adv.push(`まだ手をつけてない論点が${untouched.length}個あるで（${untouched.slice(0,4).map(t=>esc(TOPICS[t].name)).join("、")}${untouched.length>4?"…":""}）。`);
  const slow = Object.keys(TOPICS).filter(t => st[t].n>=2 && st[t].avg > 90);
  if(slow.length) adv.push(`時間がかかってる論点：${slow.map(t=>esc(TOPICS[t].name)).join("、")}。本番は60分しかないから、仕訳は1問1分以内が目標やで。`);
  if(d !== null && d >= 0 && d <= 3) adv.push(`試験まであと${d}日。<b>新しい問題に手を広げず、間違えた問題の見直しを優先</b>しよ。覚えきれへん所は紙に書きなぐるのもアリ。`);
  const recent = S.log.slice(-20), rAcc = recent.filter(l=>l.ok).length / recent.length;
  if(recent.length >= 10 && rAcc >= 0.9) adv.push("直近20問の正答率が90%超え！模試20問で本番換算の点数を確認してみよ。");
  if(!adv.length) adv.push("いい感じやで！この調子で、おまかせ10問を毎日続けよ。");
  return adv;
}

function aiPrompt(){
  const st = stats(), d = daysLeft();
  const lines = Object.keys(TOPICS).map(t => `- ${TOPICS[t].name}（第${TOPICS[t].p}問系）：${st[t].n ? `${st[t].ok}/${st[t].n}問正解（${Math.round(st[t].acc*100)}%）、平均${Math.round(st[t].avg)}秒` : "未着手"}`);
  const lr = lastResult(), wrongQ = Q.filter(q => lr[q.id]===false).map(q => `- ${q.q}`).slice(0,10);
  return `あなたは日商簿記3級の専属家庭教師です。以下は私の演習データです。
試験は60分・100点満点（第1問 仕訳15問45点／第2問 20点／第3問 決算35点）、70点で合格です。
試験まで：${d===null?"未定":d+"日"}
総回答数：${S.log.length}

【論点別の成績】
${lines.join("\n")}

【直近で間違えた問題（最大10問）】
${wrongQ.join("\n") || "なし"}

このデータから、(1)弱点の傾向、(2)配点を踏まえた優先順位、(3)試験日までの具体的な学習プラン を短く教えてください。`;
}
function copyPrompt(){
  const ta = $("#aiPrompt");
  const done = () => { $("#copied").textContent = "コピーしたで！"; };
  if(navigator.clipboard) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); document.execCommand("copy"); done(); });
  else { ta.select(); document.execCommand("copy"); done(); }
}
function resetAll(){
  if(!confirm("回答の記録をすべて消すで？元に戻されへんけど大丈夫？")) return;
  S = {log:[], exam:S.exam, diag:null}; save(); render();
}

go("home");
</script>
